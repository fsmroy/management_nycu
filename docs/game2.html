'use strict';

const story=[
{id:'mail',x:9.5,y:14.5,name:'客戶來信',role:'危機的起點',time:'清晨 06:00',short:'降價震撼',kind:'terminal',color:'#ffd38b',text:'雅斯比要求明年服務費調降20%。公司約30%營收來自中小客戶，正受到低價AI平台吸引。',insight:'基礎交付被自動化後，客戶為什麼還要付服務費？'},
{id:'sophie',x:3.5,y:9.5,name:'蘇霏',role:'媒體部總監',time:'上午 10:00',short:'效率主張',kind:'npc',color:'#73e5ec',text:'我們應該自動生成素材、A/B測試與投放，以平台建立規模能力，避免中小客戶持續流失。',insight:'效率與規模是機會，但付費需求、產品化與營運能力仍待驗證。',idle:['平台還沒好，客戶已經走了…','效率能變成我們的優勢嗎？']},
{id:'shelly',x:15.5,y:9.5,name:'周雪莉',role:'業務長',time:'同場會議',short:'信任反擊',kind:'npc',color:'#eda6d9',text:'70%營收來自大型品牌與金融業。他們買的是策略、保密與專業把關，不只是便宜產出。',insight:'深化顧問價值，也要處理成長與客戶集中風險。',idle:['信任不是按個按鈕就有的。','金融客戶需要有人把關。']},
{id:'it',x:9.5,y:9.5,name:'李廉安',role:'資訊長',time:'同場會議',short:'成本現形',kind:'npc',color:'#a8bbff',text:'寫出腳本，不等於營運企業級平台。原文估算首年基建800–1,000萬元、每月維運至少50萬元，還有人才與API維護。',insight:'不同成本評估口徑可能重疊，不可直接相加；資料隔離與技術債不能忽略。',idle:['腳本能跑，平台未必撐得住。','維運成本也要算進去呀。']},
{id:'investor',x:3.5,y:15.5,name:'林本恩',role:'股東代表',time:'週三下午',short:'資本施壓',kind:'npc',color:'#ffb984',text:'股東期待能規模化的AI轉型，並以擴張預算與退場條款施壓。',insight:'估值與退場機會，不等於公司的短期現金流與客戶安全。',idle:['下一個成長引擎在哪裡？','董事會還在等轉型計畫…']},
{id:'contract',x:15.5,y:15.5,name:'金融合約與資源評估',role:'客戶限制與成本',time:'隔天早上',short:'風險兩極',kind:'terminal',color:'#f69da7',text:'金融客戶要求人工審核軌跡、禁止專案數據用於自建模型訓練，並提出嚴苛賠償附約。同日資源評估揭露API、人事成本與稀缺人才問題。',insight:'這是案例中的客戶要求，不是一般法律規定。效率收益與風險責任未必落在同一方。'}];
const doors=[{id:'platform',x:3.5,y:3.5,name:'平台之門',kind:'door',color:'#73e5ec'},{id:'pilot',x:9.5,y:3.5,name:'驗證之門',kind:'door',color:'#ffd38b'},{id:'consult',x:15.5,y:3.5,name:'顧問之門',kind:'door',color:'#eda6d9'}];
const props=[{id:'window1',x:6.5,y:15.5,name:'玻璃展示窗',kind:'window',color:'#9defff'},{id:'window2',x:12.5,y:9.5,name:'會議室玻璃',kind:'window',color:'#9defff'},{id:'plant',x:8,y:4.5,name:'辦公盆栽',kind:'plant',color:'#8bdfb0'},{id:'cabinet',x:10.7,y:15.7,name:'文件櫃',kind:'cabinet',color:'#a9b8ce'}];const entities=[...story,...doors,...props];
const routes={platform:{title:'平台優先',value:'自動化、訂閱與規模能力',cost:'研發、維運、稀缺人才與既有大客戶關係風險。',test:'驗證付費需求、單位經濟與現金可支撐時間。'},consult:{title:'顧問優先',value:'策略、信任、保密與專業把關',cost:'中小客戶流失、成長受限、客戶集中與股東資金壓力。',test:'驗證顧問溢價與續約意願，協商資金與客戶集中風險。'},pilot:{title:'分階段驗證',value:'先限額試點，再依證據擴張',cost:'雙軌管理與資料隔離成本；股東、客戶未必接受。',test:'明訂試點客群、預算上限、期限、擴張門檻與停止條件。此路線是教學延伸。'}};
const questions=[{q:'你真正要賣的是什麼？',a:['只有更便宜的產出','符合目標客群、可驗證的價值','只有AI標籤'],correct:1},{q:'什麼不能因效率而忽略？',a:['資料用途、人工查核與責任邊界','所有資料都能拿去訓練','模型夠好就不用審核'],correct:0},{q:'提案還需要什麼？',a:['保證一定成功','只有轉型口號','預算、指標、期限與停損條件'],correct:2}];
let player={x:9.5,y:16.8,a:-Math.PI/2},stage=0,completed=false,open=false,keys={},joy={x:0,y:0,id:null},last=0,W=0,H=0,z=[],hits=[],mapOn=false,toastTimer,selected=null,lock=0,answers=[],attempts=[],reports=[],closeAction=null,focusBefore=null;
let meteorMode=false,attacks=0,brokenWalls=0,brokenObjects=0,particles=[],meteors=[],cracks=[],shake=0,flash=0,cooldown=0,now=0;const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
function resetJoy(){joy.x=joy.y=0;joy.id=null;$('knob').style.transform='translate(0px,0px)';$('joy').classList.remove('active')}
function clearInput(){keys={};resetJoy();gesture=null}
function show(content,onClose=null){clearInput();focusBefore=document.activeElement;open=true;closeAction=onClose;$('dialog').innerHTML='<button class="close" id="closemodal" aria-label="關閉對話視窗">×</button>'+content;$('modal').classList.remove('hidden');$('closemodal').onclick=close;requestAnimationFrame(()=>$('closemodal').focus())}
function close(){const fn=closeAction;closeAction=null;open=false;clearInput();$('modal').classList.add('hidden');if(focusBefore&&focusBefore.isConnected)focusBefore.focus();if(fn)fn()}
function notify(text){clearTimeout(toastTimer);$('toasttext').textContent=text;$('toast').classList.remove('hidden');toastTimer=setTimeout(()=>$('toast').classList.add('hidden'),3200)}$('closetoast').onclick=()=>{clearTimeout(toastTimer);$('toast').classList.add('hidden')};
function intro(){show('<span class="tag">手機優先 · 離線單檔HTML · 2.5D透視</span><h2>跟著時間序，走進抉擇。</h2><p>右下搖桿：上下前進後退，左右轉向，斜推可邊走邊轉。場景左右滑動也能看方向。</p><p>靠近角色或姓名牌後直接點選對談。按「完成對談」才會推進時間序；右上角 × 可立即關閉，不會跳過劇情。</p><p>依序取得6份線索，再選策略門並完成董事會三道鎖。最後可查看提案總結，並自選進入老師附身隕石彩蛋。</p><p><small>人物與數字來自使用者提供的案例；對話為摘要改寫。迷宮、第三條路線與彩蛋為教學延伸。原文沒有成功結局。無連網、無上傳。</small></p><button class="primary" id="begin">進入迷宮</button>');$('begin').onclick=close}
function timeline(){const labels=[...story.map(e=>[e.time,e.short]),['週五 19:00','十字路口'],['董事會提案','完成與總結']];$('nodes').innerHTML=labels.map((a,i)=>`<button class="node ${completed||i<stage?'done':i===stage?'current':''}" data-node="${i}" ${i===stage?'aria-current="step"':''}>${completed||i<stage?'✓ ':''}${a[0]}<b>${a[1]}</b></button>`).join('');$('progress').textContent=completed?'提案完成':`線索 ${Math.min(stage,6)}/6`;document.querySelectorAll('[data-node]').forEach(b=>b.onclick=()=>nodeInfo(Number(b.dataset.node)));requestAnimationFrame(()=>{const b=document.querySelector('.node.current');if(b)b.scrollIntoView({behavior:reduced?'auto':'smooth',block:'nearest',inline:'center'})})}
function nodeInfo(i){if(i<6&&i<stage){dialogue(story[i],true);return}if(i===7&&completed){summary();return}show(`<span class="tag">故事節點</span><h2>${i<6?story[i].name:i===6?'北側三扇策略門':'董事會提案'}</h2><p>${i===stage?'跟隨上方提示，走近目標並點選互動。':'請依序完成目前事件；點選節點不會跳過劇情。'}</p>`)}
function dialogue(e,review=false){const i=story.indexOf(e);if(i>stage){notify('請先找 '+story[stage].name+'，依故事時間序進行。');return}const active=i===stage&&!review;show(`<span class="tag">${e.time} · ${e.role}</span><h2>${e.name}</h2><p>${e.text}</p><p style="border-left:3px solid ${e.color};padding-left:14px">導讀提示：${e.insight}</p><small>摘要改寫，非逐字引述。</small><div class="actions"><button id="finishTalk" class="primary">${active?'完成對談，點亮下一節點':'關閉回顧'}</button></div>`);$('finishTalk').onclick=()=>{if(active&&stage===i){stage++;timeline();notify(stage<6?'下一站：'+story[stage].name:'線索完成，北側策略門已解鎖。')}close()}}
function wall(x,y){return !grid[Math.floor(y)]||grid[Math.floor(y)][Math.floor(x)]!=='0'}
function move(dx,dy){const r=.22;if(!wall(player.x+dx+Math.sign(dx)*r,player.y-r)&&!wall(player.x+dx+Math.sign(dx)*r,player.y+r))player.x+=dx;if(!wall(player.x-r,player.y+dy+Math.sign(dy)*r)&&!wall(player.x+r,player.y+dy+Math.sign(dy)*r))player.y+=dy}
function visible(e){const dx=e.x-player.x,dy=e.y-player.y,d=Math.hypot(dx,dy);for(let t=.1;t<d;t+=.12)if(wall(player.x+dx*t/d,player.y+dy*t/d))return false;return true}
function interact(e){if(open)return;if(meteorMode){attack(e);return}if(e.kind!=='npc'&&e.kind!=='terminal'&&e.kind!=='door'){notify('這是場景物件，完成提案後可在彩蛋中互動。');return}if(Math.hypot(e.x-player.x,e.y-player.y)>2.3){notify('再靠近「'+e.name+'」一點。');return}if(!visible(e))return;if(e.kind!=='door'){dialogue(e);return}if(stage<6){notify('先依時間序取得線索：'+story[stage].name);return}selected=e;show(`<span class="tag">週五晚間 · 十字路口</span><h2>${e.name}</h2><p>這扇門代表取捨，不是保證成功。驗證之門是教學延伸，不是原文結局。</p><div class="actions"><button id="enterDoor" class="primary">選擇這條路</button><button id="cancelDoor">再想一下</button></div>`);$('enterDoor').onclick=()=>{stage=7;lock=0;answers=[];attempts=[];timeline();showLock()};$('cancelDoor').onclick=close}

$('reset').onclick=()=>{show('<h2>重新開始？</h2><p>會清除這一輪的劇情、提案與彩蛋進度。</p><div class="actions"><button id="confirmReset" class="danger">確定重玩</button><button id="cancelReset">取消</button></div>');$('cancelReset').onclick=close;$('confirmReset').onclick=()=>{if(meteorMode)setMeteor(false);grid=originalGrid.map(r=>r.split(''));entities.forEach(e=>e.goneUntil=0);player={x:9.5,y:16.8,a:-Math.PI/2};stage=0;completed=false;selected=null;reports=[];answers=[];attempts=[];attacks=brokenWalls=brokenObjects=0;cooldown=0;particles=[];meteors=[];cracks=[];for(const id of ['summarybtn','bonusbtn'])$(id).classList.add('hidden');timeline();close()}};
