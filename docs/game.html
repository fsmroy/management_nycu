const story=[
{id:'mail',x:9.5,y:14.5,name:'客戶來信',role:'危機的起點',time:'清晨 06:00',short:'降價震撼',color:'#ffd17d',kind:'terminal',text:'雅斯比要求明年服務費調降20%。公司約30%營收來自中小客戶，這群客戶正轉向低價AI平台。',insight:'當基礎產出被自動化，客戶為什麼還要付代理商服務費？'},
{id:'sophie',x:3.5,y:9.5,name:'蘇霏',role:'媒體部總監',time:'上午 10:00',short:'效率主張',color:'#65e5ee',kind:'npc',text:'我們不能只賣人力。自動生成素材、A/B測試與投放，可以讓服務規模超越人力限制。但平台還沒建好，中小客戶已經在流失。',insight:'她看見效率與規模的機會，但需求、成本與產品化能力仍待驗證。'},
{id:'shelly',x:15.5,y:9.5,name:'周雪莉',role:'業務長',time:'同場會議',short:'信任反擊',color:'#eda4d8',kind:'npc',text:'我們70%的營收來自大型品牌與金融業。他們買的是策略、保密、判斷與專業把關。全面商品化，可能讓我們失去差異。',insight:'守住信任不等於沒有風險，成長與客戶集中仍是問題。'},
{id:'it',x:9.5,y:9.5,name:'李廉安',role:'資訊長',time:'同場會議',short:'成本現形',color:'#a4b8ff',kind:'npc',text:'寫出腳本，跟營運企業級平台是兩回事。案例估算首年基建800–1,000萬元，每月維運至少50萬元；還有人才、API維護與資安責任。',insight:'不同成本評估口徑可能重疊，不可直接相加。技術門檻下降，不代表營運責任消失。'},
{id:'investor',x:3.5,y:15.5,name:'林本恩',role:'股東代表',time:'週三下午',short:'資本施壓',color:'#ffb57d',kind:'npc',text:'我要看到能規模化的AI轉型計畫。若只守住現有利潤，股東可能反對擴張預算，甚至考慮退場。',insight:'估值與退場機會，是資本方的目標；不等於公司的短期現金流與客戶安全。'},
{id:'contract',x:15.5,y:15.5,name:'金融合約與資源評估',role:'隔日的新限制',time:'隔天早上',short:'風險兩極',color:'#f48e9a',kind:'terminal',text:'金融客戶要求完整人工審核軌跡，禁止專案數據用於自建模型訓練，並提出嚴苛賠償附約。同日的資源評估又揭露API與人事成本，以及稀缺人才招募問題。',insight:'附約是案例中的客戶要求，不是一般法律規定。效率收益與風險責任不一定由同一方承擔。'}];

let joy={x:0,y:0,id:null};

function show(content){resetJoy();keys={};open=true;$('dialog').innerHTML=content;$('modal').classList.remove('hidden')}function close(){open=false;keys={};$('modal').classList.add('hidden')}function notify(t){clearTimeout(toastTimer);$('toast').textContent=t;$('toast').classList.remove('hidden');toastTimer=setTimeout(()=>$('toast').classList.add('hidden'),3000)}
function intro(){show('<span class="tag">手機優先 · 單檔HTML · 離線可用</span><h2>跟著時間序，走進抉擇。</h2><p>① 拖曳右下虛擬搖桿：往上前進、往下後退、左右轉向；斜推可邊走邊轉。推得越遠，速度越快，放開立即停止。也能在場景左右滑動看方向。</p><p>② 靠近發光角色或文件，<b>直接點選角色</b>開啟對話。閱讀後按「完成對談」，底部時間節點才會亮起並前進。</p><p>③ 按時間序依序收集6份線索，再到北側選擇策略之門。點底部節點可查看下一站與已讀內容，不會跳過故事。</p><p><small>同場會議的三位主管依原文發言順序排列；沒有虛構精確時刻。最後路線為教學推演，不是原文結局。採用2.5D透視與角色看板，非完整WebGL模型。沒有真實倒數。</small></p><button class="primary" id="begin">開始探索</button>');$('begin').onclick=close}
function timeline(){const labels=[...story.map(e=>[e.time,e.short]),['週五 19:00','十字路口'],['董事會提案','帶著取捨離開']];$('nodes').innerHTML=labels.map((a,i)=>`<button class="node ${i<stage||completed?'done':i===stage?'current':''}" data-node="${i}" ${i===stage?'aria-current="step"':''}><span class="dot"></span>${i<stage||completed?'✓ ':''}${a[0]}<b>${a[1]}</b></button>`).join('');$('progress').textContent=completed?'提案完成':`線索 ${Math.min(stage,6)} / 6`;document.querySelectorAll('[data-node]').forEach(b=>b.onclick=()=>nodeInfo(Number(b.dataset.node)));requestAnimationFrame(()=>{const b=document.querySelector('.node.current');if(b)b.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'nearest',inline:'center'})})}
function nodeInfo(i){if(i<story.length&&i<stage){dialogue(story[i],true);return}const title=i<6?story[i].name:i===6?'北側三扇策略之門':'董事會提案';show(`<span class="tag">${i===stage?'目前節點':'尚未到達的節點'}</span><h2>${title}</h2><p>${i===stage?'跟隨上方導航，走近目標並點選互動。':'請依時間序完成目前節點；不會因點選節點就跳過對話。'}</p><button id="return" class="primary">回到場景</button>`);$('return').onclick=close}
function dialogue(e,review=false){const index=story.indexOf(e);if(index>stage){notify('故事尚未到這裡。請先找 '+story[stage].name+'。');return}const active=index===stage&&!review;show(`<span class="tag">${e.time} · ${e.role} · ${active?'目前故事節點':'已讀回顧'}</span><h2>${e.name}</h2><p>${e.text}</p><p style="border-left:3px solid ${e.color};padding-left:14px">導讀提示：${e.insight}</p><small>依使用者提供的文章摘要改寫，非逐字引述。</small><div class="actions"><button id="finishTalk" class="primary">${active?'完成對談，點亮下一節點':'關閉回顧'}</button>${active?'<button id="later">稍後再讀，不推進</button>':''}</div>`);$('finishTalk').onclick=()=>{if(active&&stage===index){stage++;timeline();notify(stage<6?'時間序已前進：下一站 '+story[stage].name:'六份線索完成，北側策略之門已解鎖。')}close()};if(active)$('later').onclick=close}
function wall(x,y){return !grid[Math.floor(y)]||grid[Math.floor(y)][Math.floor(x)]!=='0'}
function move(dx,dy){const r=.22;if(!wall(player.x+dx+Math.sign(dx)*r,player.y-r)&&!wall(player.x+dx+Math.sign(dx)*r,player.y+r))player.x+=dx;if(!wall(player.x-r,player.y+dy+Math.sign(dy)*r)&&!wall(player.x+r,player.y+dy+Math.sign(dy)*r))player.y+=dy}
function visible(e){const dx=e.x-player.x,dy=e.y-player.y,d=Math.hypot(dx,dy);for(let t=.1;t<d;t+=.12)if(wall(player.x+dx*t/d,player.y+dy*t/d))return false;return true}
function interact(e){if(open)return;if(Math.hypot(e.x-player.x,e.y-player.y)>2.3){notify('再靠近「'+e.name+'」一點，就能點選交談。');return}if(!visible(e))return;if(e.kind!=='door'){dialogue(e);return}if(stage<6){notify('先依時間序收集線索，目前目標：'+story[stage].name);return}selected=e;show(`<span class="tag">週五晚間 · 十字路口</span><h2>${e.name}</h2><p>這扇門代表一種取捨，不代表保證成功。進入後，請確認客戶價值、責任邊界與驗證條件。</p><p><small>「驗證之門」是教學延伸，原文只提出平台與顧問兩端的抉擇。</small></p><div class="actions"><button class="primary" id="enter">選擇這條路</button><button id="cancelDoor">再想一下</button></div>`);$('enter').onclick=()=>{stage=7;lock=0;timeline();showLock()};$('cancelDoor').onclick=close}
const locks=[['你真正要賣的是什麼？',['只有更便宜的產出','符合目標客群、可驗證的價值','只有AI標籤'],1],['什麼不能因效率而忽略？',['資料用途、人工查核與責任邊界','所有資料都能拿去訓練','模型夠好就不用審核'],0],['提案還需要什麼？',['保證一定成功','只有轉型口號','預算、指標、期限與停損條件'],2]];
function showLock(){const l=locks[lock];show(`<span class="tag">${selected.name} · 董事會鎖 ${lock+1}/3</span><h2>${l[0]}</h2><div class="actions" style="display:grid">${l[1].map((a,i)=>`<button data-answer="${i}">${a}</button>`).join('')}</div><p id="feedback" role="status"></p><button id="leaveLock">返回探索</button>`);document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{if(Number(b.dataset.answer)!==l[2]){$('feedback').textContent='這會忽略故事中的限制，請再想一下。';return}lock++;if(lock===3)ending();else showLock()});$('leaveLock').onclick=close}
function ending(){completed=true;timeline();const e={platform:['平台優先','以自動化與訂閱建立規模，但要承擔研發、維運與大客戶關係風險。','驗證付費需求、單位經濟與現金可支撐時間。'],consult:['顧問優先','深化策略與信任，但中小客戶流失、成長與股東壓力仍在。','驗證顧問溢價、續約意願，處理客戶集中與資金方案。'],pilot:['分階段驗證','先限額試點，但雙軌會增加管理成本，股東與客戶也未必接受。','明確定義試點客群、資料隔離、費用上限、期限與停止條件。']}[selected.id];show(`<span class="tag">時間序完成 · 密室已開啟</span><h2>${e[0]}</h2><p>${e[1]}</p><h3>可能的轉機與驗證</h3><p>${e[2]}</p><p><b>原文沒有最終結局。你完成的是一份取捨提案，不是成功預測。</b></p><button class="primary" id="againDoor">回到場景，比較其他路線</button>`);$('againDoor').onclick=close}
function update(dt){if(open)return;const turn=Math.max(-1,Math.min(1,joy.x+(keys.d||keys.ArrowRight?1:0)-(keys.a||keys.ArrowLeft?1:0))),f=Math.max(-1,Math.min(1,-joy.y+(keys.w||keys.ArrowUp?1:0)-(keys.s||keys.ArrowDown?1:0)));player.a+=turn*dt*1.7;move(Math.cos(player.a)*f*dt*2.5,Math.sin(player.a)*f*dt*2.5)}

const idleLines={sophie:['客戶都在找更快的方法…','效率，能變成我們的優勢嗎？','平台還沒好，客戶已經走了。'],shelly:['信任不是按個按鈕就有的。','金融客戶需要有人把關…','便宜，真的就是價值嗎？'],it:['腳本能跑，平台未必撐得住。','維運成本也要算進去呀。','資料隔離，不能省。'],investor:['下一個成長引擎在哪裡？','董事會還在等轉型計畫…','規模與獲利，該怎麼取捨？']};
function idleBubble(e,x,ly,ratio,depth){if(e.kind!=='npc'||depth<2.3||depth>8.5||!visible(e))return;const lines=idleLines[e.id];if(!lines)return;const n=story.indexOf(e),line=lines[Math.floor(performance.now()/4800+n)%lines.length];const fs=12*ratio;ctx.font=`500 ${fs}px system-ui`;const width=ctx.measureText(line).width+22*ratio,bh=32*ratio;const bx=Math.max(6*ratio,Math.min(W-width-6*ratio,x-width/2)),by=Math.max(170*ratio,ly-fs-bh-12*ratio);if(by+bh>ly-fs-4*ratio)return;ctx.fillStyle='#f0fff5f2';ctx.beginPath();ctx.roundRect(bx,by,width,bh,11*ratio);ctx.fill();ctx.beginPath();ctx.moveTo(Math.max(bx+12*ratio,Math.min(bx+width-12*ratio,x))-5*ratio,by+bh);ctx.lineTo(Math.max(bx+12*ratio,Math.min(bx+width-12*ratio,x)),by+bh+7*ratio);ctx.lineTo(Math.max(bx+12*ratio,Math.min(bx+width-12*ratio,x))+5*ratio,by+bh);ctx.fill();ctx.fillStyle='#173c43';ctx.textAlign='center';ctx.fillText(line,bx+width/2,by+21*ratio)}

function render(){const ratio=Math.min(devicePixelRatio||1,1.4),w=Math.floor(innerWidth*ratio),h=Math.floor(innerHeight*ratio);if(W!==w||H!==h){W=canvas.width=w;H=canvas.height=h}ctx.fillStyle='#122033';ctx.fillRect(0,0,W,H/2);const grad=ctx.createLinearGradient(0,H/2,0,H);grad.addColorStop(0,'#111c2a');grad.addColorStop(1,'#3b4d5a');ctx.fillStyle=grad;ctx.fillRect(0,H/2,W,H/2);const proj=W/(2*Math.tan(Math.PI/6)),strip=3;z=[];hits=[];
for(let sx=0;sx<W;sx+=strip){const a=player.a+Math.atan((sx-W/2)/proj),dx=Math.cos(a),dy=Math.sin(a),ddx=Math.abs(1/dx),ddy=Math.abs(1/dy),stx=dx<0?-1:1,sty=dy<0?-1:1;let mx=Math.floor(player.x),my=Math.floor(player.y),sdx=(dx<0?player.x-mx:mx+1-player.x)*ddx,sdy=(dy<0?player.y-my:my+1-player.y)*ddy,side=0;for(let n=0;n<70;n++){if(sdx<sdy){sdx+=ddx;mx+=stx;side=0}else{sdy+=ddy;my+=sty;side=1}if(!grid[my]||grid[my][mx]!=='0')break}const raw=side?sdy-ddy:sdx-ddx,d=Math.max(.05,raw*Math.cos(a-player.a)),size=proj/d,top=H/2-size/2,shade=Math.max(.18,1-d/24)*(side?.78:1);ctx.fillStyle=`rgb(${[45,78,100].map(v=>Math.floor(v*shade)).join(',')})`;ctx.fillRect(sx,top,strip+1,size);ctx.fillStyle=`rgba(110,232,220,${shade*.4})`;ctx.fillRect(sx,top+size*.12,strip+1,Math.max(1,size*.015));ctx.fillRect(sx,top+size*.87,strip+1,Math.max(1,size*.008));for(let k=sx;k<sx+strip;k++)z[k]=d}
const sprites=entities.map(e=>{const dx=e.x-player.x,dy=e.y-player.y;return{e,d:dx*Math.cos(player.a)+dy*Math.sin(player.a),lat:-dx*Math.sin(player.a)+dy*Math.cos(player.a)}}).filter(o=>o.d>.2).sort((a,b)=>b.d-a.d);
for(const {e,d,lat} of sprites){const x=W/2+lat/d*proj,worldSize=proj/d,s=worldSize*(e.kind==='npc'?.56:1),base=H/2+worldSize*.48,isDoor=e.kind==='door',top=base-s*(isDoor?1.3:1.08);if(x+s<0||x-s>W)continue;ctx.save();ctx.beginPath();for(let sx=Math.max(0,Math.floor(x-s*.45));sx<Math.min(W,x+s*.45);sx+=3)if(d<=(z[sx]||100)+.1)ctx.rect(sx,0,3,H);ctx.clip();const active=(stage<6&&story[stage]===e)||(stage>=6&&isDoor);if(active){ctx.fillStyle='#ffcf8033';ctx.beginPath();ctx.ellipse(x,base,s*.42,s*.11,0,0,7);ctx.fill()}ctx.fillStyle='#07121c88';ctx.beginPath();ctx.ellipse(x,base,s*.25,s*.06,0,0,7);ctx.fill();if(e.kind==='npc'){ctx.fillStyle='#20314b';ctx.beginPath();ctx.roundRect(x-s*.19,base-s*.24,s*.15,s*.24,s*.06);ctx.roundRect(x+s*.04,base-s*.24,s*.15,s*.24,s*.06);ctx.fill();ctx.fillStyle=e.color;ctx.beginPath();ctx.roundRect(x-s*.25,base-s*.65,s*.5,s*.46,s*.14);ctx.fill();ctx.fillStyle='#f0cdb3';ctx.beginPath();ctx.arc(x,base-s*.83,s*.25,0,Math.PI*2);ctx.fill();ctx.fillStyle='#29324b';ctx.beginPath();ctx.arc(x,base-s*.88,s*.25,Math.PI,Math.PI*2);ctx.fill();ctx.fillStyle='#26334b';for(const eye of [-1,1]){ctx.beginPath();ctx.arc(x+eye*s*.085,base-s*.82,s*.022,0,7);ctx.fill()}ctx.strokeStyle='#9b635a';ctx.lineWidth=Math.max(1,s*.014);ctx.beginPath();ctx.arc(x,base-s*.77,s*.055,.15,Math.PI-.15);ctx.stroke();ctx.fillStyle='#ec9b9a88';for(const cheek of [-1,1]){ctx.beginPath();ctx.ellipse(x+cheek*s*.15,base-s*.76,s*.045,s*.025,0,0,7);ctx.fill()}}else if(isDoor){ctx.fillStyle=e.color;ctx.fillRect(x-s*.38,top,s*.76,s*1.3);ctx.fillStyle='#0a1828';ctx.fillRect(x-s*.32,top+s*.06,s*.64,s*1.24);ctx.fillStyle=e.color;ctx.fillRect(x-s*.24,base-s*.92,s*.48,s*.025)}else{ctx.fillStyle='#2b4355';ctx.fillRect(x-s*.23,base-s*.75,s*.46,s*.75);ctx.fillStyle=e.color;ctx.fillRect(x-s*.19,base-s*.69,s*.38,s*.3)}
ctx.restore();if(d<10&&visible(e)){const fs=Math.max(12*ratio,Math.min(20*ratio,s*.13)),label=(active?'◆ ':story.indexOf(e)>=0&&story.indexOf(e)<stage?'✓ ':'')+e.name;ctx.font=`600 ${fs}px system-ui`;ctx.textAlign='center';const tw=ctx.measureText(label).width,ly=top-fs*.6;ctx.fillStyle='#06121fe8';ctx.fillRect(x-tw/2-8,ly-fs,tw+16,fs*1.7);ctx.fillStyle=active?'#ffcf80':e.color;ctx.fillText(label,x,ly);idleBubble(e,x,ly,ratio,d);hits.push({e,x1:Math.min(x-s*.4,x-tw/2-8)/ratio,x2:Math.max(x+s*.4,x+tw/2+8)/ratio,y1:(ly-fs)/ratio,y2:Math.max(base/ratio,(ly-fs)/ratio+44),d})}}
const target=stage<6?story[stage]:doors[1],dx=target.x-player.x,dy=target.y-player.y;let rel=Math.atan2(dy,dx)-player.a;rel=Math.atan2(Math.sin(rel),Math.cos(rel));const dir=Math.abs(rel)<.3?'正前方':Math.abs(rel)>2.6?'後方':rel>0?'右側':'左側';$('goal').textContent=completed?'提案完成，可比較其他策略之門。':stage<6?`下一站：${target.time} · ${target.name}｜${dir} ${Math.hypot(dx,dy).toFixed(0)}m`:'北側三扇策略門已解鎖，請選擇一條路。';$('hint').textContent='點角色或姓名牌交談。\n距離太遠？先靠近。\n方向提示為直線方位，遇牆請繞行。';if(mapOn)drawMap()}
function drawMap(){const rows=grid.map((r,y)=>r.split('').map((v,x)=>{if(Math.floor(player.x)===x&&Math.floor(player.y)===y)return'●';const e=entities.find(e=>Math.floor(e.x)===x&&Math.floor(e.y)===y);if(e){const i=story.indexOf(e);return e.kind==='door'?'門':i===stage?'★':i<stage?'✓':'?'}return v==='1'?'▪':'·'}).join(' '));$('map').textContent='北 ↑  ●你 ★下一站\n'+rows.join('\n')}
let gesture=null;canvas.addEventListener('pointerdown',e=>{if(open)return;gesture={id:e.pointerId,startX:e.clientX,startY:e.clientY,lastX:e.clientX,moved:false};canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(!gesture||gesture.id!==e.pointerId||open)return;const dist=Math.hypot(e.clientX-gesture.startX,e.clientY-gesture.startY);if(dist>9)gesture.moved=true;if(gesture.moved)player.a+=(e.clientX-gesture.lastX)*.006;gesture.lastX=e.clientX});canvas.addEventListener('pointerup',e=>{if(gesture&&gesture.id===e.pointerId&&!gesture.moved&&!open){const hit=hits.filter(h=>e.clientX>=h.x1&&e.clientX<=h.x2&&e.clientY>=h.y1&&e.clientY<=h.y2).sort((a,b)=>a.d-b.d)[0];if(hit)interact(hit.e);else notify('點選可見的角色或姓名牌；可用地圖找下一站。')}gesture=null});canvas.addEventListener('pointercancel',()=>gesture=null);

function resetJoy(){joy.x=0;joy.y=0;joy.id=null;$('stick').style.transform='translate(0px,0px)';$('joystick').classList.remove('active')}
function trackJoy(e){const r=$('joystick').getBoundingClientRect(),max=r.width*.32;let dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2;const length=Math.hypot(dx,dy);if(length>max){dx=dx/length*max;dy=dy/length*max}const mag=Math.hypot(dx,dy)/max,dead=.13,scale=mag<=dead?0:(mag-dead)/(1-dead);joy.x=mag?dx/max/mag*scale:0;joy.y=mag?dy/max/mag*scale:0;$('stick').style.transform=`translate(${dx}px,${dy}px)`}
$('joystick').addEventListener('pointerdown',e=>{if(open||joy.id!==null)return;e.preventDefault();joy.id=e.pointerId;$('joystick').setPointerCapture(e.pointerId);$('joystick').classList.add('active');trackJoy(e)});
$('joystick').addEventListener('pointermove',e=>{if(e.pointerId===joy.id){e.preventDefault();trackJoy(e)}});
for(const event of ['pointerup','pointercancel','lostpointercapture'])$('joystick').addEventListener(event,e=>{if(e.pointerId===joy.id)resetJoy()});

const held=new Map();document.querySelectorAll('[data-key]').forEach(b=>{b.onpointerdown=e=>{e.preventDefault();b.setPointerCapture(e.pointerId);held.set(e.pointerId,b.dataset.key);keys[b.dataset.key]=true;b.classList.add('down')};function release(e){const k=held.get(e.pointerId);held.delete(e.pointerId);if(k)keys[k]=[...held.values()].includes(k);b.classList.remove('down')}b.onpointerup=release;b.onpointercancel=release;b.onlostpointercapture=release});
window.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key))e.preventDefault();keys[e.key.length===1?e.key.toLowerCase():e.key]=true});window.addEventListener('keyup',e=>keys[e.key.length===1?e.key.toLowerCase():e.key]=false);function clearInput(){resetJoy();keys={};held.clear();gesture=null;document.querySelectorAll('.down').forEach(b=>b.classList.remove('down'))}window.addEventListener('blur',clearInput);document.addEventListener('visibilitychange',()=>{clearInput();last=0});
$('mapbtn').onclick=()=>{mapOn=!mapOn;$('map').classList.toggle('hidden',!mapOn)};$('help').onclick=intro;$('journal').onclick=()=>{show('<h2>線索簿</h2>'+(stage?story.slice(0,Math.min(stage,6)).map(e=>`<span class="tag">${e.time}</span><h3>${e.name}</h3><p>${e.text}</p>`).join(''):'<p>先找清晨的客戶來信終端。</p>')+'<small>改編自使用者提供的黃國峯、王淑芳文章。所有數字僅代表案例敘述；未外部查核。迷宮與謎題為教學設計。無連網、無資料上傳。</small><div class="actions"><button id="closeJournal" class="primary">回到迷宮</button></div>');$('closeJournal').onclick=close};$('reset').onclick=()=>{show('<h2>重新開始？</h2><p>會清除這一輪的對談進度。</p><div class="actions"><button id="confirmReset" class="primary">確定重玩</button><button id="cancelReset">取消</button></div>');$('cancelReset').onclick=close;$('confirmReset').onclick=()=>{player={x:9.5,y:16.8,a:-Math.PI/2};stage=0;completed=false;selected=null;clearInput();timeline();close()}};
function loop(t){const dt=last?Math.min((t-last)/1000,.04):0;last=t;update(dt);render();requestAnimationFrame(loop)}timeline();intro();requestAnimationFrame(loop);
</script></body></html>
